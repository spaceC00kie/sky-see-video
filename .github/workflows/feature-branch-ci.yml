name: Branch CI (Auto-Format & Test)

on:
  push:
    branches-ignore: [main, develop]

permissions:
  contents: write

jobs:
  format-check-and-fix:
    name: Auto-Format & Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Check Prettier formatting
        id: prettier-check
        run: |
          if yarn format:check; then
            echo "formatting-needed=false" >> $GITHUB_OUTPUT
          else
            # Check if it's a syntax error by trying to format
            if yarn format; then
              echo "formatting-needed=true" >> $GITHUB_OUTPUT
              echo "Formatting issues found and will be auto-fixed"
            else
              echo "❌ Syntax error detected - cannot auto-format"
              exit 1  # Fail the job if there are syntax errors
            fi
          fi
      - name: Check for changes after formatting
        if: steps.prettier-check.outputs.formatting-needed == 'true'
        id: verify-changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes-made=true" >> $GITHUB_OUTPUT
          else
            echo "changes-made=false" >> $GITHUB_OUTPUT
          fi
      - name: Commit formatting changes
        if: steps.verify-changes.outputs.changes-made == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "style: auto-format code with Prettier [skip ci]"
          git push

  test:
    name: Run Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run type checking
        run: yarn type-check
      - name: Run linting
        run: yarn lint
      - name: Run tests with coverage
        run: yarn test:ci
        env:
          CI: true

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run security audit
        run: yarn npm audit || echo "Security audit completed with warnings"
