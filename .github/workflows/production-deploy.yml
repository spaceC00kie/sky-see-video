name: Production Deploy

on:
  push:
    branches: [main] # Only deploy to production when main is updated

permissions:
  contents: read

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run quality checks before production deploy
        run: |
          echo "🔍 Running final quality checks before production deploy..."
          yarn type-check
          yarn lint
          yarn format:check
          yarn test:ci

      - name: Build for production
        run: yarn build

      - name: Deploy to Firebase Production
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SKY_SEE_VIDEO }}
          channelId: live
          projectId: sky-see-video

      - name: Notify deployment success
        run: |
          echo "🎉 Successfully deployed to production!"
          echo "🌐 Live site: https://sky-see-video.web.app"
