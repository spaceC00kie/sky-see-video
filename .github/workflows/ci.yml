name: CI

on:
  pull_request:
    branches: ["**"]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    name: PR CI
    runs-on: ubuntu-latest
    concurrency:
      group: pr-ci-${{ github.event.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Type check
        run: yarn type-check

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check

      - name: Run tests (CI)
        run: yarn test:ci

      - name: Build
        run: yarn build

      - name: Decide deploy channel (preview vs production)
        id: channel
        run: |
          echo "Base branch: ${{ github.event.pull_request.base.ref }}"
          if [ "${{ github.event.pull_request.base.ref }}" = "main" ]; then
            echo "CHANNEL=live" >> $GITHUB_OUTPUT
            echo "EXPIRES=" >> $GITHUB_OUTPUT
          else
            echo "CHANNEL=preview-${{ github.event.number }}" >> $GITHUB_OUTPUT
            echo "EXPIRES=30d" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Firebase (Preview or Production)
        # Only deploy for PRs originating from this repo (secrets unavailable for forks)
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        id: firebase-deploy
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SKY_SEE_VIDEO }}
          channelId: ${{ steps.channel.outputs.CHANNEL }}
          expires: ${{ steps.channel.outputs.EXPIRES }}

      - name: Deployment summary
        if: ${{ steps.firebase-deploy.outcome == 'success' }}
        run: |
          echo "Deployed channel: ${{ steps.channel.outputs.CHANNEL }}"
          echo "Preview details URL (if preview): ${{ steps.firebase-deploy.outputs.details_url }}"

      - name: Comment preview URL on PR
        if: ${{ steps.firebase-deploy.outcome == 'success' && steps.channel.outputs.CHANNEL != 'live' && steps.firebase-deploy.outputs.details_url != '' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview-deploy
          message: |
            ✅ Preview deployed
            URL: ${{ steps.firebase-deploy.outputs.details_url }}
            Expires: ${{ steps.firebase-deploy.outputs.expire_time }}
