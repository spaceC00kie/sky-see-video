name: CI/CD Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  format-check-and-fix:
    name: Format & Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Check Prettier formatting
        id: prettier-check
        run: |
          if yarn format:check; then
            echo "formatting-needed=false" >> $GITHUB_OUTPUT
          else
            echo "formatting-needed=true" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true
      - name: Auto-fix formatting if needed
        if: steps.prettier-check.outputs.formatting-needed == 'true'
        run: yarn format
      - name: Check for changes after formatting
        if: steps.prettier-check.outputs.formatting-needed == 'true'
        id: verify-changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes-made=true" >> $GITHUB_OUTPUT
          else
            echo "changes-made=false" >> $GITHUB_OUTPUT
          fi
      - name: Commit formatting changes (for pushes only)
        if: github.event_name == 'push' && steps.verify-changes.outputs.changes-made == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "style: auto-format code with Prettier [skip ci]"
          git push

  test:
    name: Run Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run type checking
        run: yarn type-check
      - name: Run linting
        run: yarn lint
      - name: Run tests with coverage
        run: yarn test:ci
        env:
          CI: true

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run security audit
        run: yarn npm audit || echo "Security audit completed with warnings"

  quality-gates-complete:
    name: All Quality Gates Passed
    runs-on: ubuntu-latest
    needs: [format-check-and-fix, test, security-audit]
    steps:
      - name: Quality gates summary
        run: echo "All quality gates have passed successfully!"

  deploy-preview:
    name: Deploy Preview to Firebase
    runs-on: ubuntu-latest
    needs: quality-gates-complete
    if: github.event_name == 'pull_request' && (github.event.pull_request.base.ref == 'main' || github.event.pull_request.base.ref == 'develop')
    permissions:
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Deploy to Firebase Preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SKY_SEE_VIDEO }}
          projectId: sky-see-video

  deploy-production:
    name: Deploy Production to Firebase
    runs-on: ubuntu-latest
    needs: quality-gates-complete
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Deploy to Firebase Production
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SKY_SEE_VIDEO }}
          channelId: live
          projectId: sky-see-video
