name: CI/CD Pipeline Overview

on:
  workflow_run:
    workflows: ["Auto-fix Code Quality", "Preview Deploy", "Production Deploy"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  pipeline-status:
    name: Pipeline Status Overview
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Pipeline Status Summary
        run: |
          echo "## 🚀 CI/CD Pipeline Status"
          echo ""
          echo "This repository uses multiple specialized workflows:"
          echo ""
          echo "### � Auto-fix Code Quality"
          echo "- **Trigger**: Push to any branch"
          echo "- **Purpose**: Auto-fix lint/format issues, run quality checks"
          echo "- **Status**: ${{ github.event.workflow_run.conclusion }}"
          echo ""
          echo "### 🌟 Preview Deploy"
          echo "- **Trigger**: Pull request to any branch"
          echo "- **Purpose**: Deploy preview and comment URL on PR"
          echo ""
          echo "### 🚀 Production Deploy"
          echo "- **Trigger**: Push to main branch"
          echo "- **Purpose**: Deploy to production after quality checks"
          echo ""
          echo "✅ All workflows are independent and run based on their specific triggers."
