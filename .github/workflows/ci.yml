name: CI/CD Pipeline

on:
  pull_request:
    branches: ["**"] # All branches can receive PRs
  push:
    branches: ["**"] # All branches - auto-fix lint/format issues

permissions:
  contents: write
  pull-requests: write
  checks: write
  actions: read

jobs:
  # AUTO-FIX AND QUALITY CHECKS JOB - Runs on all pushes
  auto-fix-and-check:
    name: Auto-fix Code Quality & Run Checks
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Auto-fix formatting and linting
        run: |
          echo "🔧 Auto-fixing code quality issues..."
          yarn lint:fix || true
          yarn format || true

      - name: Check for changes after auto-fix
        id: verify-changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes-made=true" >> $GITHUB_OUTPUT
            echo "📝 Changes were made during auto-fix"
          else
            echo "changes-made=false" >> $GITHUB_OUTPUT
            echo "✅ No changes needed"
          fi

      - name: Commit auto-fix changes
        if: steps.verify-changes.outputs.changes-made == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "🤖 Auto-fix: format and lint code [skip ci]"
          git push

      - name: Run type checking
        run: yarn type-check

      - name: Check formatting
        run: |
          echo "🎨 Checking code formatting..."
          yarn format:check

      - name: Check linting
        run: |
          echo "🔧 Checking code linting..."
          yarn lint

      - name: Run tests with coverage
        run: yarn test:ci
        env:
          CI: true

      - name: Run security audit
        run: yarn npm audit --severity moderate --all || echo "⚠️ Security audit completed with warnings"

  # PREVIEW DEPLOY JOB - Only runs on PRs
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build for preview
        run: yarn build

      - name: Deploy to Firebase Preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        id: deploy-preview
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SKY_SEE_VIDEO }}
          projectId: sky-see-video

      - name: Comment Preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('🚀 Preview Deployment')
            );

            const previewUrl = '${{ steps.deploy-preview.outputs.details_url }}';
            const body = `## 🚀 Preview Deployment
            
            ✅ Your preview deployment is ready!
            
            **🔗 Preview URL:** ${previewUrl}
            
            This preview will be automatically updated with new commits to this PR.`;

            if (botComment) {
              github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  # PRODUCTION DEPLOY JOB - Only runs when main is updated (via PR merge from develop)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' && 
      github.ref == 'refs/heads/main'
    needs: [auto-fix-and-check]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build for production
        run: yarn build

      - name: Deploy to Firebase Production
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SKY_SEE_VIDEO }}
          channelId: live
          projectId: sky-see-video

      - name: Notify deployment success
        run: |
          echo "🎉 Successfully deployed to production!"
          echo "🌐 Live site: https://sky-see-video.web.app"
