name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: write
  pull-requests: write

jobs:
  format-check-and-fix:
    name: Format & Lint Code
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'yarn'
        
    - name: Install dependencies
      run: yarn install --frozen-lockfile
      
    - name: Check Prettier formatting
      id: prettier-check
      run: |
        if yarn format:check; then
          echo "formatting-needed=false" >> $GITHUB_OUTPUT
          echo "✅ Code is already properly formatted"
        else
          echo "formatting-needed=true" >> $GITHUB_OUTPUT
          echo "⚠️ Code formatting issues found - will auto-fix"
        fi
      continue-on-error: true
        
    - name: Auto-fix formatting if needed
      if: steps.prettier-check.outputs.formatting-needed == 'true'
      run: |
        echo "🔧 Running Prettier to fix formatting..."
        yarn format
        
    - name: Check for changes after formatting
      if: steps.prettier-check.outputs.formatting-needed == 'true'
      id: verify-changes
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "changes-made=true" >> $GITHUB_OUTPUT
          echo "📝 Files were formatted by Prettier"
        else
          echo "changes-made=false" >> $GITHUB_OUTPUT
          echo "✅ No formatting changes needed"
        fi
        
    - name: Commit formatting changes (for pushes only)
      if: github.event_name == 'push' && steps.verify-changes.outputs.changes-made == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git commit -m "style: auto-format code with Prettier [skip ci]"
        git push

  test:
    name: Run Tests & Coverage
    runs-on: ubuntu-latest
    needs: [format-check-and-fix]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'yarn'
        
    - name: Install dependencies
      run: yarn install --frozen-lockfile
      
    - name: Run type checking
      run: yarn type-check
      
    - name: Run linting
      run: yarn lint
      
    - name: Run tests with coverage
      run: yarn test:ci
      env:
        CI: true

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'yarn'
        
    - name: Install dependencies
      run: yarn install --frozen-lockfile
      
    - name: Build application
      run: yarn build
      
    - name: Check build artifacts
      run: |
        echo "✅ Build completed successfully!"
        du -sh dist/ || echo "Build output directory not found"
        ls -la dist/ || echo "No build artifacts to display"

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'yarn'
        
    - name: Install dependencies
      run: yarn install --frozen-lockfile
      
    - name: Run security audit
      run: yarn audit --groups dependencies --level moderate || echo "Security audit completed with warnings"
