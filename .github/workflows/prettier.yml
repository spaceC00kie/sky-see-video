name: Prettier Check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - run: yarn install --immutable
      - run: yarn format:check
