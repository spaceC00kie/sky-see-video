name: Auto-fix Code Quality

on:
  push:
    branches: ["**"] # All branches - auto-fix lint/format issues

permissions:
  contents: write

jobs:
  auto-fix-and-check:
    name: Auto-fix Code Quality & Run Checks
    runs-on: ubuntu-latest
    # Skip if the last commit was from GitHub Action (auto-fix bot)
    if: ${{ !contains(github.event.head_commit.author.name, 'GitHub Action') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check if code quality fixes are needed
        id: quality-check
        run: |
          if yarn lint; then
            echo "needs-fixing=false" >> $GITHUB_OUTPUT
            echo "✅ Code passes all quality checks (lint + format)"
          else
            echo "needs-fixing=true" >> $GITHUB_OUTPUT
            echo "❌ Code needs quality fixes (lint + format)"
          fi
        continue-on-error: true

      - name: Auto-fix code quality issues
        if: steps.quality-check.outputs.needs-fixing == 'true'
        run: |
          echo "🔧 Auto-fixing code quality issues (lint + format)..."
          yarn lint --fix

      - name: Check for changes after auto-fix
        id: verify-changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes-made=true" >> $GITHUB_OUTPUT
            echo "📝 Changes were made during auto-fix"
          else
            echo "changes-made=false" >> $GITHUB_OUTPUT
            echo "✅ No changes needed"
          fi

      - name: Commit auto-fix changes
        if: steps.verify-changes.outputs.changes-made == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "🤖 Auto-fix: code quality (lint + format)"
          git push

      - name: Run type checking
        run: yarn type-check

      - name: Final quality verification
        run: |
          echo "🔍 Final verification that all quality checks pass..."
          yarn lint

      - name: Run tests with coverage
        run: yarn test:ci
        env:
          CI: true

      - name: Run security audit
        run: yarn npm audit --severity moderate --all || echo "⚠️ Security audit completed with warnings"
