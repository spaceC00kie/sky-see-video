name: Code Quality Auto-fix

on:
  push:
    branches: ["**"] # All branches - auto-fix lint/format issues

permissions:
  contents: write

jobs:
  code-quality-check:
    name: Code Quality Check & Auto-fix
    runs-on: ubuntu-latest
    # Add concurrency to prevent multiple simultaneous auto-fix runs for the same commit
    concurrency:
      group: code-quality-${{ github.ref }}
      cancel-in-progress: false
    # Skip if the last commit was from GitHub Action (auto-fix bot)
    if: ${{ !contains(github.event.head_commit.author.name, 'GitHub Action') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run auto-fix only
        run: |
          echo "🔧 Running auto-fix for code quality..."
          yarn lint --fix || true

      - name: Check for changes and commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "📝 Auto-fix made changes, committing..."
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add .
            git commit -m "🤖 Auto-fix: code quality"
            git push
          else
            echo "✅ No changes needed"
          fi
