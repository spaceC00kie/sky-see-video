name: Auto-fix Code Quality

on:
  push:
    branches: ["**"] # All branches - auto-fix lint/format issues

permissions:
  contents: write

jobs:
  auto-fix-and-check:
    name: Auto-fix Code Quality & Run Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check if formatting is needed
        id: format-check
        run: |
          if yarn format:check; then
            echo "needs-formatting=false" >> $GITHUB_OUTPUT
            echo "✅ Code is properly formatted"
          else
            echo "needs-formatting=true" >> $GITHUB_OUTPUT
            echo "❌ Code needs formatting"
          fi
        continue-on-error: true

      - name: Check if linting is needed
        id: lint-check
        run: |
          if yarn lint; then
            echo "needs-linting=false" >> $GITHUB_OUTPUT
            echo "✅ Code passes linting"
          else
            echo "needs-linting=true" >> $GITHUB_OUTPUT
            echo "❌ Code has linting issues"
          fi
        continue-on-error: true

      - name: Auto-fix formatting
        if: steps.format-check.outputs.needs-formatting == 'true'
        run: |
          echo "🎨 Auto-fixing code formatting..."
          yarn format

      - name: Auto-fix linting
        if: steps.lint-check.outputs.needs-linting == 'true'
        run: |
          echo "🔧 Auto-fixing linting issues..."
          yarn lint:fix

      - name: Check for changes after auto-fix
        id: verify-changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes-made=true" >> $GITHUB_OUTPUT
            echo "📝 Changes were made during auto-fix"
          else
            echo "changes-made=false" >> $GITHUB_OUTPUT
            echo "✅ No changes needed"
          fi

      - name: Commit auto-fix changes
        if: steps.verify-changes.outputs.changes-made == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          
          # Create descriptive commit message based on what was fixed
          COMMIT_MSG="🤖 Auto-fix:"
          if [ "${{ steps.format-check.outputs.needs-formatting }}" == "true" ]; then
            COMMIT_MSG="$COMMIT_MSG format"
          fi
          if [ "${{ steps.lint-check.outputs.needs-linting }}" == "true" ]; then
            if [ "${{ steps.format-check.outputs.needs-formatting }}" == "true" ]; then
              COMMIT_MSG="$COMMIT_MSG and lint"
            else
              COMMIT_MSG="$COMMIT_MSG lint"
            fi
          fi
          COMMIT_MSG="$COMMIT_MSG code [skip ci]"
          
          git commit -m "$COMMIT_MSG"
          git push

      - name: Run type checking
        run: yarn type-check

      - name: Check formatting (final verification)
        run: |
          echo "🎨 Final formatting verification..."
          yarn format:check

      - name: Check linting (final verification)
        run: |
          echo "🔧 Final linting verification..."
          yarn lint

      - name: Run tests with coverage
        run: yarn test:ci
        env:
          CI: true

      - name: Run security audit
        run: yarn npm audit --severity moderate --all || echo "⚠️ Security audit completed with warnings"
