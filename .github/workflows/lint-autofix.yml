name: Lint Auto-Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint-fix:
    name: Automatic Lint Fixes (manual)
    runs-on: ubuntu-latest
    concurrency:
      group: lint-fix-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Notice
        run: |
          echo "This workflow is manual-only. CI on pull_request handles checks."
